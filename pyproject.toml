[project]
name = "esri-mcp"
version = "0.1.0"
description = "MCP server exposing ArcGIS data and services as tools for LLM agents"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.8.0",  # streamable-http transport requires >=1.8
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
# IWA/NTLM web-tier auth for ArcGIS Server behind Windows Integrated Authentication
iwa = ["httpx-ntlm>=1.3.0"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esri_mcp"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: hits live Esri sample servers (deselect with '-m \"not integration\"')",
]
